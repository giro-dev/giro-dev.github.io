# Experimental config for previewing the site with the Gruvbox Hugo theme.
# https://github.com/schnerring/hugo-theme-gruvbox
#
# This file is intentionally SEPARATE from config.toml so the production
# GitHub Pages build (which uses the custom layouts in ./layouts) is untouched.
#
# The theme is vendored into ./_vendor, so building the preview needs only
# Hugo (extended) + Node — Go is NOT required:
#
#   npm install                                   # one time, installs theme deps
#   hugo server --config hugo.gruvbox.toml        # preview at http://localhost:1313
#
# To update / re-vendor the theme (this DOES need Go >= 1.25 installed):
#   hugo mod get -u --config hugo.gruvbox.toml
#   hugo mod npm pack --config hugo.gruvbox.toml && npm install
#   hugo mod vendor --config hugo.gruvbox.toml
#   # then re-add `"type": "module"` to _vendor/.../hugo-theme-gruvbox/package.json
#   # (its postcss.config.js is ESM but upstream package.json omits the field)

baseURL = 'https://giro-dev.github.io/'
languageCode = 'en-us'
title = 'Albert Giró Quer — Lead Software Engineer & Software Architect'
publishDir = 'public'

# The theme ships an English + German demo; keep only English for this preview.
defaultContentLanguage = 'en'
disableLanguages = ['de']

[params]
  name = 'Albert Giró Quer'
  subtitle = 'Lead Software Engineer • Software Architect'
  tagline = 'Lead Software Engineer • Software Architect • Java • Spring Boot • Distributed Systems'
  location = 'Madrid, Spain'
  email = 'agiroq@uoc.edu'
  linkedin = 'https://www.linkedin.com/in/albert-giro-quer'
  github = 'https://github.com/giro-dev'
  defaultTheme = 'dark'
  themeColor = 'orange'
  themeContrast = 'medium'

  [params.logo]
    text = 'Albert Giró'
    url = '/'

[menu]
  [[menu.main]]
    identifier = 'blog'
    name = 'Blog'
    url = '/blog'
    weight = 10
  [[menu.main]]
    identifier = 'github'
    name = 'GitHub'
    url = 'https://github.com/giro-dev'
    weight = 20

[markup]
  # To be able to use all Prism plugins, the theme enables unsafe rendering.
  _merge = "deep"

[build]
  # Merge build config of the theme.
  _merge = "deep"

[outputs]
  # The search requires rendering the theme's `searchIndex` output format.
  home = ["html", "searchIndex"]

[module]
  [[module.imports]]
    path = "github.com/schnerring/hugo-theme-gruvbox"
  [[module.imports]]
    path = "github.com/schnerring/hugo-mod-json-resume"
    [[module.imports.mounts]]
      source = "data"
      target = "data"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "assets/css/json-resume.css"
      target = "assets/css/critical/44-json-resume.css"

  # Project mounts. We map ./layouts to an EMPTY placeholder dir so the custom
  # portfolio layouts in ./layouts do NOT shadow the Gruvbox theme layouts.
  # (Defining this mount replaces Hugo's implicit `layouts -> layouts` mount.)
  [[module.mounts]]
    source = "layouts-gruvbox-placeholder"
    target = "layouts"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"

  # Theme dependencies (installed via `hugo mod npm pack` + `npm install`).
  [[module.mounts]]
    source = "node_modules/simple-icons/icons"
    target = "assets/simple-icons"
  [[module.mounts]]
    source = "node_modules/prismjs"
    target = "assets/prismjs"
  [[module.mounts]]
    source = "node_modules/prism-themes/themes"
    target = "assets/prism-themes"
  [[module.mounts]]
    source = "node_modules/typeface-fira-code/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "node_modules/typeface-roboto-slab/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "node_modules/@tabler/icons/icons"
    target = "assets/tabler-icons"
  [[module.mounts]]
    # Add hugo_stats.json to Hugo's server watcher.
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"
